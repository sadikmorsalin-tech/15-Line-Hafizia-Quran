<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hafezi Quran</title>
<style>
:root{--p:#1DC4B2;--pd:#0E8F81;--on:#05312d;--bg:#f4fbfa;--card:#fff;--tx:#12302d;--mu:#6b8480;--soft:#e3f7f4;--bd:#bfe8e3;--red:#d64545;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);box-sizing:border-box}
:root[data-theme=dark]{--bg:#0d1f1d;--card:#142b28;--tx:#e6f6f4;--mu:#8fb0ab;--soft:#173833;--bd:#245650}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--tx);display:flex;justify-content:center}
#app{width:100%;max-width:520px;height:100%;display:flex;flex-direction:column;position:relative;background:var(--bg);overflow:hidden}
header{background:var(--p);color:var(--on);padding:calc(var(--sat) + 12px) 52px 12px;text-align:center;font-size:20px;font-weight:700;position:relative;flex:none;min-height:56px}
header button{position:absolute;bottom:6px;background:none;border:0;font-size:22px;color:var(--on);padding:6px 10px}
header .l{left:6px}header .r{right:6px}header .r2{right:46px}
main{flex:1;overflow-y:auto;padding:14px 14px 24px}
.qa{display:flex;gap:10px;margin-bottom:12px}
.qa button{flex:1;background:var(--card);border:0;border-radius:16px;padding:14px 4px 10px;color:var(--tx);font-size:13px;box-shadow:0 2px 10px rgba(0,0,0,.07);display:flex;flex-direction:column;align-items:center;gap:4px}
.qa i{font-style:normal;font-size:24px}.qa small{color:var(--mu);font-size:11px}
.tabs{display:flex;border-bottom:1px solid var(--bd);margin-bottom:12px;position:sticky;top:-14px;background:var(--bg);z-index:2;padding-top:2px}
.tabs button{flex:1;background:none;border:0;padding:12px 4px;font-size:15px;color:var(--mu);border-bottom:3px solid transparent}
.tabs button.on{color:var(--pd);font-weight:700;border-color:var(--p)}
.it{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.bd{width:38px;height:38px;border-radius:50%;background:var(--soft);color:var(--pd);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.mid{flex:1;min-width:0}
.nm{font-weight:600;font-size:16px}.nm .ar{font-weight:400;color:var(--mu);font-size:15px}
.sb{color:var(--mu);font-size:12.5px;margin-top:2px}
.pgn{font-weight:700;color:var(--pd);font-size:15px}
.x{background:none;border:0;color:var(--red);font-size:20px;padding:4px 8px}
input[type=search],input[type=number]{width:100%;border:1.5px solid var(--p);border-radius:16px;padding:12px 14px;font-size:16px;background:var(--card);color:var(--tx);font-family:inherit;margin-bottom:12px}
.empty{text-align:center;color:var(--mu);margin-top:12vh}.empty b{display:block;font-size:17px;margin:10px 0 6px;color:var(--mu)}
.sw{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:16px;padding:16px;margin-bottom:10px;box-shadow:0 1px 8px rgba(0,0,0,.06)}
.sw small{display:block;color:var(--mu);font-size:12px;margin-top:2px}
.sw input{appearance:none;-webkit-appearance:none;width:48px;height:28px;border-radius:20px;background:var(--bd);position:relative;flex:none;margin:0;border:0}
.sw input:before{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw input:checked{background:var(--pd)}.sw input:checked:before{left:23px}
.btn{background:var(--p);color:var(--on);border:0;border-radius:30px;padding:14px;font-size:16px;font-weight:700;width:100%}
.btn2{background:var(--soft);color:var(--pd)}
.rd{position:absolute;inset:0;background:var(--bg);display:flex;flex-direction:column;z-index:10}
#stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;background:#1a1f1e;position:relative;overflow:hidden}
#book{width:100%;height:100%}
.pg{background:#fff;overflow:hidden}
.pg img{width:100%;height:100%;display:block;object-fit:fill;-webkit-user-drag:none;user-select:none;pointer-events:none}
.inv .pg{background:#000}.inv .pg img{filter:invert(1)}
.rh{padding-bottom:8px;text-align:center;font-size:17px}
.rh small{display:block;font-size:12px;font-weight:500;opacity:.8}
.rf{flex:none;display:flex;align-items:center;justify-content:space-between;background:var(--card);padding:8px 14px calc(var(--sab) + 8px);border-top:1px solid var(--bd)}
.rf button{background:var(--soft);color:var(--pd);border:0;border-radius:14px;padding:8px 18px;font-size:20px;font-weight:700;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.rf button small{font-size:10px;font-weight:600}
.rf .gp{font-size:15px;min-width:110px}
#modal{position:absolute;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:22px;z-index:30}
#modal .box{background:var(--card);border-radius:22px;padding:20px;width:100%}
#splash{position:absolute;inset:0;z-index:40;background:linear-gradient(#0e8f81,#1DC4B2);color:var(--on);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .4s}
#splash .logo{width:104px;height:104px;border-radius:28px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:54px;margin-bottom:18px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.stf__parent{margin:0 auto}
</style>
</head>

  V.pf.loadFromHTML(els);
  V.pf.on('flip',function(e){onPage(TOTAL-e.data)});
 }catch(err){V.pf=null;var st=$('stage');if(st)st.innerHTML='<div style="color:#fff;padding:20px;text-align:center">Page viewer could not start.</div>'}
 onPage(p);
 if(S.wake&&navigator.wakeLock){navigator.wakeLock.request('screen').then(function(l){V.wl=l}).catch(function(){})}}
function onPage(p){
 V.page=p;S.last=p;save();var idx=TOTAL-p,keep={};
 for(var d=-3;d<=3;d++){var k=idx+d;if(k>=0&&k<TOTAL){keep[k]=1;if(!V.loaded[k])loadImg(k)}}
 Object.keys(V.loaded).forEach(function(k){if(!keep[k]){var im=V.imgs[k];if(im)im.removeAttribute('src');delete V.loaded[k]}});
 setHead(p)}
function setHead(p){var t=$('rtt');if(t){t.textContent=pTitle(p);$('rsb').textContent=pSub(p);$('gpb').textContent=p+' / '+TOTAL;$('bmk').textContent=S.bm.indexOf(p)>=0?'\u2605':'\u2606'}}
function loadImg(k){V.loaded[k]=1;PG.url(TOTAL-k).then(function(u){if(V.loaded[k]&&V.imgs[k])V.imgs[k].src=u})}
function flipNext(){if(V.pf)V.pf.flipPrev()}
function flipPrev(){if(V.pf)V.pf.flipNext()}
function togBm(){var p=V.page,i=S.bm.indexOf(p);if(i>=0)S.bm.splice(i,1);else S.bm.push(p);save();$('bmk').textContent=i>=0?'\u2606':'\u2605'}
function closeReader(fromPop){try{if(V.pf)V.pf.destroy()}catch(e){}V.pf=null;V.imgs=[];V.loaded={};if(V.wl){try{V.wl.release()}catch(e){}V.wl=null}V.view='home';if(!fromPop){try{history.back()}catch(e){}}render()}
function back(){if(V.view==='reader')closeReader(false);else{try{history.back()}catch(e){}V.view='home';render()}}
function render(){
 var hd=$('head'),mn=$('main'),rd=$('reader');
 if(V.view==='reader'){hd.style.display='none';mn.style.display='none';
  rd.innerHTML='<div class="rd"><header class="rh"><button class="l" onclick="back()">\u2190</button><div><b id="rtt"></b><small id="rsb"></small></div><button class="r" id="bmk" onclick="togBm()">\u2606</button></header><div id="stage" class="'+(S.dark&&S.inv?'inv':'')+'"><div id="book"></div></div><div class="rf"><button onclick="flipNext()">\u2039<small>Next</small></button><button class="gp" id="gpb" onclick="goPage(true)">1 / '+TOTAL+'</button><button onclick="flipPrev()">\u203a<small>Prev</small></button></div></div>';return}
 rd.innerHTML='';hd.style.display='';mn.style.display='';
 if(V.view==='settings'){hd.innerHTML='<header><button class="l" onclick="back()">\u2190</button>Settings</header>';mn.innerHTML=setHTML();return}
 hd.innerHTML='<header><button class="l" onclick="toggleSearch()">\ud83d\udd0d</button>Hafezi Quran<button class="r" onclick="setOpt(\'dark\',!S.dark)">'+(S.dark?'\u2600\ufe0f':'\ud83c\udf19')+'</button></header>';
 mn.innerHTML=homeHTML()}
render();
setTimeout(function(){var s=$('splash');s.style.opacity=0;setTimeout(function(){s.style.display='none'},400)},1100);
</script>
</body>
</html>
